<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BunkSafe 🛡</title>
<link rel="stylesheet" href="css/style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d0d0d">
</head>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js');
    });
  }
</script>
<body>

<div id="onboarding" class="hidden">
    <!-- renderOnboarding() fills this in -->
</div>

<div id="app" class="hidden">
    <!-- renderDashboard() fills this in -->
</div>

<div id="add-subject-modal" class="hidden">
    <!-- openAddSubjectModal() fills this in -->
</div>

<script src="js/storage.js"></script>
<script src="js/calc.js"></script>
<script src="js/pixel-canvas.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
</body>
</html>
